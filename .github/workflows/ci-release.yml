name: browso-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Optional stable release to publish"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "minor"
          - "major"

permissions:
  contents: read

concurrency:
  group: browso-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: codeql / security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions,javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions-javascript-typescript"

      - name: Validate Dependabot config
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/dependabot.yml"); puts "Dependabot config parsed successfully."'

      - name: Dispatch pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not configured."
            exit 0
          fi

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            '{
              event_type: "browso-pages-build",
              client_payload: {
                repository: "browso/browso",
                commit: $commit,
                ref: $ref
              }
            }' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Browso/browso.github.io/dispatches \
              --data-binary @-

  quality:
    name: quality
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify npm lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report to GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/node

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ github.sha }}
          path: coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 30

  release_plan:
    name: release-plan
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      release_type: ${{ steps.plan.outputs.release_type }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve stable release plan
        id: plan
        env:
          DEFAULT_RELEASE_TYPE: ${{ github.event_name == 'push' && 'minor' || 'none' }}
          RELEASE_COMMIT_MESSAGE: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            format('[release: {0}]', inputs.release_type) ||
            github.event.head_commit.message }}
        run: |
          node scripts/release-plan.mjs > release-plan.json
          cat release-plan.json
          {
            echo "should_release=$(jq -r '.shouldRelease' release-plan.json)"
            echo "release_type=$(jq -r '.releaseType // empty' release-plan.json)"
            echo "version=$(jq -r '.version // empty' release-plan.json)"
            echo "tag=$(jq -r '.tag // empty' release-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.sha }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 30

  package_macos:
    name: package-macos
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.release_plan.outputs.should_release == 'true'
    needs:
      - release_plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            arch: arm64
            artifact: macos-arm64
            asset: browso-mac-apple-silicon.dmg
            pattern: "*.dmg"
            channel: mac-arm64
          - label: Intel
            runner: macos-15-intel
            arch: x64
            artifact: macos-x64
            asset: browso-mac-mac-intel.dmg
            pattern: "*.dmg"
            channel: mac-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply release version
        run: npm version "${{ needs.release_plan.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Configure Apple signing and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Apple signing is disabled because these secrets are missing: ${missing[*]}"
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            echo "CSC_LINK=$MACOS_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "MACOS_SIGNING_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off

      - name: Build application
        run: npm run build

      - name: Sign, notarize, and package macOS DMG
        if: env.MACOS_SIGNING_ENABLED == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: >
            npx electron-builder
            --mac dmg zip
            --${{ matrix.arch }}
            -c browso-builder.yml
            --publish never
            --config.publish.channel=${{ matrix.channel }}
            --config.forceCodeSigning=true
            --config.directories.output=release/${{ matrix.arch }}

      - name: Package ad-hoc signed macOS DMG
        if: env.MACOS_SIGNING_ENABLED != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: >
            npx electron-builder
            --mac dmg zip
            --${{ matrix.arch }}
            -c browso-builder.yml
            --publish never
            --config.publish.channel=${{ matrix.channel }}
            --config.mac.identity=-
            --config.mac.hardenedRuntime=false
            --config.mac.notarize=false
            --config.directories.output=release/${{ matrix.arch }}

      - name: Test packaged macOS application
        shell: bash
        run: |
          executable="$(find "release/${{ matrix.arch }}" -type f -path '*/Browso.app/Contents/MacOS/Browso' -print -quit)"
          if [ -z "$executable" ]; then
            echo "The packaged macOS executable was not found."
            exit 1
          fi
          "$executable" --smoke-test

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          find "release/${{ matrix.arch }}" -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          package_path="$(find "release/${{ matrix.arch }}" -type f -name '${{ matrix.pattern }}' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No ${{ matrix.pattern }} package was produced."
            exit 1
          fi
          cp "$package_path" "release-assets/${{ matrix.asset }}"

      - name: Verify Gatekeeper acceptance
        if: env.MACOS_SIGNING_ENABLED == 'true'
        run: >
          bash scripts/verify-macos-release.sh
          "release-assets/${{ matrix.asset }}"
          "$APPLE_TEAM_ID"

      - name: Verify ad-hoc macOS signature
        if: env.MACOS_SIGNING_ENABLED != 'true'
        run: >
          bash scripts/verify-macos-adhoc-release.sh
          "release-assets/${{ matrix.asset }}"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  package_windows:
    name: package-windows
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.release_plan.outputs.should_release == 'true'
    needs:
      - release_plan
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply release version
        run: npm version "${{ needs.release_plan.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows signing
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) {
            Write-Warning "WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD are not configured. Continuing with an unsigned Windows build."
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_SIGNING_ENABLED=false"
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
            )

            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:WINDOWS_PFX_PASSWORD,
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
          } catch {
            throw "WINDOWS_PFX_BASE64 is not a valid password-protected PFX: $($_.Exception.Message)"
          }

          if (-not $certificate.HasPrivateKey) {
            throw "The Windows signing certificate does not contain a private key."
          }

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $enhancedKeyUsage = $certificate.Extensions |
            Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] }
          if (-not $enhancedKeyUsage -or $codeSigningOid -notin $enhancedKeyUsage.EnhancedKeyUsages.Value) {
            throw "The Windows certificate is not valid for code signing."
          }

          $now = Get-Date
          if ($now -lt $certificate.NotBefore -or $now -gt $certificate.NotAfter) {
            throw "The Windows signing certificate is not currently valid."
          }

          Write-Host "Using Windows signing certificate: $($certificate.Subject)"
          Write-Host "Certificate expires: $($certificate.NotAfter.ToString('u'))"

          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_SIGNING_ENABLED=true"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_PFX_PASSWORD"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)"

      - name: Build application
        run: npm run build

      - name: Package Windows installer
        shell: pwsh
        run: |
          $command = "npx"
          $commandArgs = @(
            "electron-builder",
            "--win",
            "nsis",
            "--x64",
            "-c",
            "browso-builder.yml",
            "--publish",
            "never",
            "--config.publish.channel=win-x64",
            "--config.directories.output=release/x64"
          )

          if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
            $commandArgs += "--config.forceCodeSigning=true"
            $commandArgs += '--config.win.signingHashAlgorithms=["sha256"]'
          }

          & $command @commandArgs

      - name: Test packaged Windows application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "release/x64/win-unpacked/Browso.exe" `
            -ArgumentList "--smoke-test" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged Windows startup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows startup smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          find release/x64 -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          package_path="$(find release/x64 -type f -name '*.exe' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No Windows package was produced."
            exit 1
          fi
          cp "$package_path" release-assets/browso-win-x64.exe

      - name: Verify Windows signature
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          pwsh -File scripts/verify-windows-release.ps1 `
            -FilePath "release-assets/browso-win-x64.exe" `
            -ExpectedThumbprint "$env:WINDOWS_CERTIFICATE_THUMBPRINT"
          pwsh -File scripts/verify-windows-release.ps1 `
            -FilePath "release/x64/win-unpacked/Browso.exe" `
            -ExpectedThumbprint "$env:WINDOWS_CERTIFICATE_THUMBPRINT"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  package_linux:
    name: package-linux
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.release_plan.outputs.should_release == 'true'
    needs:
      - release_plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply release version
        run: npm version "${{ needs.release_plan.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Linux AppImage
        run: >
          npx electron-builder
          --linux AppImage
          --x64
          -c browso-builder.yml
          --publish never
          --config.publish.channel=linux-x64
          --config.directories.output=release/x64

      - name: Test packaged Linux application
        shell: bash
        run: |
          executable="$(find "release/x64" -type f -path '*/linux-unpacked/Browso' -print -quit)"
          if [ -z "$executable" ]; then
            echo "The packaged Linux executable was not found."
            exit 1
          fi
          timeout 30s xvfb-run -a "$executable" --no-sandbox --smoke-test

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          find release/x64 -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          package_path="$(find release/x64 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No Linux package was produced."
            exit 1
          fi
          cp "$package_path" release-assets/browso-linux-x86-64.AppImage

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  attest_build_provenance:
    name: attest-build-provenance
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.release_plan.outputs.should_release == 'true'
    needs:
      - release_plan
      - package_macos
      - package_windows
      - package_linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: release-assets/*

  publish_release:
    name: publish-release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.release_plan.outputs.should_release == 'true'
    needs:
      - release_plan
      - attest_build_provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ github.sha }}
          path: release-plan

      - name: Resolve release version
        run: |
          echo "RELEASE_VERSION=${{ needs.release_plan.outputs.version }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${{ needs.release_plan.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Verify release assets
        run: |
          test -f release-assets/browso-linux-x86-64.AppImage
          test -f release-assets/browso-mac-apple-silicon.dmg
          test -f release-assets/browso-mac-mac-intel.dmg
          test -f release-assets/browso-win-x64.exe
          test -f release-assets/mac-arm64-mac.yml
          test -f release-assets/mac-x64-mac.yml
          test -f release-assets/win-x64.yml
          test -f release-assets/linux-x64-linux.yml
          find release-assets -maxdepth 1 -type f \
            ! -name '*.yml' ! -name '*.blockmap' ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          jq -r '.notesMarkdown' release-plan/release-plan.json > "$RUNNER_TEMP/release-notes.md"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its immutable assets unchanged."
          else
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish release metadata to website
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          jq -n \
            --slurpfile plan release-plan/release-plan.json \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            '{
              event_type: "browso-release-published",
              client_payload: {
                repository: "browso/browso",
                release: {
                  version: $plan[0].version,
                  tag: $plan[0].tag,
                  type: $plan[0].releaseType,
                  publishedAt: $published_at,
                  commit: $commit,
                  notes: $plan[0].notes,
                  notesSections: $plan[0].notesSections,
                  notesSummary: $plan[0].notesSummary,
                  notesMarkdown: $plan[0].notesMarkdown,
                  releaseUrl: ("https://github.com/browso/browso/releases/tag/" + $plan[0].tag),
                  assets: {
                    macAppleSilicon: ("https://github.com/browso/browso/releases/download/" + $plan[0].tag + "/browso-mac-apple-silicon.dmg"),
                    macIntel: ("https://github.com/browso/browso/releases/download/" + $plan[0].tag + "/browso-mac-mac-intel.dmg"),
                    windows: ("https://github.com/browso/browso/releases/download/" + $plan[0].tag + "/browso-win-x64.exe"),
                    linux: ("https://github.com/browso/browso/releases/download/" + $plan[0].tag + "/browso-linux-x86-64.AppImage"),
                    checksums: ("https://github.com/browso/browso/releases/download/" + $plan[0].tag + "/SHA256SUMS.txt")
                  }
                }
              }
            }' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Browso/browso.github.io/dispatches \
              --data-binary @-

  benchmarks:
    name: benchmarks
    if: >-
      always() &&
      needs.security.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.release_plan.result == 'success' &&
      (needs.package_macos.result == 'success' || needs.package_macos.result == 'skipped') &&
      (needs.package_windows.result == 'success' || needs.package_windows.result == 'skipped') &&
      (needs.package_linux.result == 'success' || needs.package_linux.result == 'skipped') &&
      (needs.attest_build_provenance.result == 'success' || needs.attest_build_provenance.result == 'skipped') &&
      (needs.publish_release.result == 'success' || needs.publish_release.result == 'skipped')
    needs:
      - security
      - quality
      - build
      - test
      - release_plan
      - package_macos
      - package_windows
      - package_linux
      - attest_build_provenance
      - publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run final benchmarks
        env:
          BROWSO_SHA: ${{ github.sha }}
          BROWSO_REF: ${{ github.ref }}
          BROWSO_VERSION: ${{ needs.release_plan.outputs.version }}
          BROWSO_WORKFLOW_RUN_ID: ${{ github.run_id }}
          BROWSO_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmark-results/browso.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish benchmark results to website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          jq -n \
            --slurpfile benchmark benchmark-results/browso.json \
            '{
              event_type: "browso-benchmarks-updated",
              client_payload: {
                repository: "browso/browso",
                benchmark: $benchmark[0]
              }
            }' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Browso/browso.github.io/dispatches \
              --data-binary @-
