name: Build, Test, Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naviq-ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: 1. Bootstrap & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  testing:
    name: 2. Testing
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:smoke

  package:
    name: 3. Release Build - ${{ matrix.label }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            asset: Browso-macOS-Apple-Silicon.dmg
            pattern: "*.dmg"
          - label: Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
            asset: Browso-macOS-Intel.dmg
            pattern: "*.dmg"
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
            asset: Browso-Windows-x64-Setup.exe
            pattern: "*.exe"
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
            asset: Browso-Linux-x86_64.AppImage
            pattern: "*.AppImage"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Apple signing and notarization
        if: matrix.platform == 'mac'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Apple signing is disabled because these secrets are missing: ${missing[*]}"
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            echo "CSC_LINK=$MACOS_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "MACOS_SIGNING_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build

      - name: Sign, notarize, and package macOS DMG
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED == 'true'
        run: >
          npx electron-builder
          --mac dmg
          --${{ matrix.arch }}
          -c browso-builder.yml
          --config.forceCodeSigning=true
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package ad-hoc signed macOS DMG
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED != 'true'
        run: >
          npx electron-builder
          --mac dmg
          --${{ matrix.arch }}
          -c browso-builder.yml
          --config.mac.identity=-
          --config.mac.hardenedRuntime=false
          --config.mac.notarize=false
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package Windows installer
        if: matrix.platform == 'win'
        run: >
          npx electron-builder
          --win nsis
          --${{ matrix.arch }}
          -c browso-builder.yml
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: >
          npx electron-builder
          --linux AppImage
          --${{ matrix.arch }}
          -c browso-builder.yml
          --config.directories.output=release/${{ matrix.arch }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          package_path="$(find "release/${{ matrix.arch }}" -type f -name '${{ matrix.pattern }}' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No ${{ matrix.pattern }} package was produced."
            exit 1
          fi
          cp "$package_path" "release-assets/${{ matrix.asset }}"

      - name: Verify Gatekeeper acceptance
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED == 'true'
        run: >
          bash scripts/verify-macos-release.sh
          "release-assets/${{ matrix.asset }}"
          "$APPLE_TEAM_ID"

      - name: Verify ad-hoc macOS signature
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED != 'true'
        run: >
          bash scripts/verify-macos-adhoc-release.sh
          "release-assets/${{ matrix.asset }}"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish_latest:
    name: 4. Publish Latest Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -f release-assets/Browso-macOS-Apple-Silicon.dmg
          test -f release-assets/Browso-macOS-Intel.dmg
          test -f release-assets/Browso-Windows-x64-Setup.exe
          test -f release-assets/Browso-Linux-x86_64.AppImage
          sha256sum release-assets/* | tee release-assets/SHA256SUMS.txt

      - name: Read application version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Rolling Browso ${APP_VERSION} desktop builds from commit \`${GITHUB_SHA}\`.

          ## Downloads

          - **macOS Apple Silicon:** \`Browso-macOS-Apple-Silicon.dmg\`
          - **macOS Intel:** \`Browso-macOS-Intel.dmg\`
          - **Windows x64:** \`Browso-Windows-x64-Setup.exe\`
          - **Linux x64:** \`Browso-Linux-x86_64.AppImage\`
          - **Checksums:** \`SHA256SUMS.txt\`

          macOS builds are signed, notarized, and Gatekeeper-verified when the
          repository's Apple signing credentials are configured. Otherwise the
          workflow publishes ad-hoc signed builds that users can approve with
          Finder's Open command or in System Settings.
          EOF

      - name: Replace rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest \
            release-assets/Browso-macOS-Apple-Silicon.dmg \
            release-assets/Browso-macOS-Intel.dmg \
            release-assets/Browso-Windows-x64-Setup.exe \
            release-assets/Browso-Linux-x86_64.AppImage \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Browso ${APP_VERSION} Latest" \
            --notes-file release-notes.md \
            --latest
