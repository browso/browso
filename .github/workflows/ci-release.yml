name: Build, Test, Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naviq-ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 1. Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  bootstrap:
    name: 2. Bootstrap & Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify npm lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  testing:
    name: 2. Testing
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:smoke

  package:
    name: 3. Release Build - ${{ matrix.label }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            asset: browso-mac-apple-silicon.dmg
            pattern: "*.dmg"
            channel: mac-arm64
          - label: Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
            asset: browso-mac-mac-intel.dmg
            pattern: "*.dmg"
            channel: mac-x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
            asset: browso-win-x64.exe
            pattern: "*.exe"
            channel: win-x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
            asset: browso-linux-x86-64.AppImage
            pattern: "*.AppImage"
            channel: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Apple signing and notarization
        if: matrix.platform == 'mac'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Apple signing is disabled because these secrets are missing: ${missing[*]}"
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            echo "CSC_LINK=$MACOS_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "MACOS_SIGNING_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build

      - name: Sign, notarize, and package macOS DMG
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED == 'true'
        run: >
          npx electron-builder
          --mac dmg zip
          --${{ matrix.arch }}
          -c browso-builder.yml
          --publish never
          --config.publish.channel=${{ matrix.channel }}
          --config.forceCodeSigning=true
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package ad-hoc signed macOS DMG
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED != 'true'
        run: >
          npx electron-builder
          --mac dmg zip
          --${{ matrix.arch }}
          -c browso-builder.yml
          --publish never
          --config.publish.channel=${{ matrix.channel }}
          --config.mac.identity=-
          --config.mac.hardenedRuntime=false
          --config.mac.notarize=false
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package Windows installer
        if: matrix.platform == 'win'
        run: >
          npx electron-builder
          --win nsis
          --${{ matrix.arch }}
          -c browso-builder.yml
          --publish never
          --config.publish.channel=${{ matrix.channel }}
          --config.directories.output=release/${{ matrix.arch }}

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: >
          npx electron-builder
          --linux AppImage
          --${{ matrix.arch }}
          -c browso-builder.yml
          --publish never
          --config.publish.channel=${{ matrix.channel }}
          --config.directories.output=release/${{ matrix.arch }}

      - name: Test packaged macOS application
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          executable="$(find "release/${{ matrix.arch }}" -type f -path '*/Browso.app/Contents/MacOS/Browso' -print -quit)"
          if [ -z "$executable" ]; then
            echo "The packaged macOS executable was not found."
            exit 1
          fi
          "$executable" --smoke-test

      - name: Test packaged Windows application
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "release/${{ matrix.arch }}/win-unpacked/Browso.exe" `
            -ArgumentList "--smoke-test" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged Windows startup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows startup smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Test packaged Linux application
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          executable="$(find "release/${{ matrix.arch }}" -type f -path '*/linux-unpacked/Browso' -print -quit)"
          if [ -z "$executable" ]; then
            echo "The packaged Linux executable was not found."
            exit 1
          fi
          timeout 30s xvfb-run -a "$executable" --no-sandbox --smoke-test

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          find "release/${{ matrix.arch }}" -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          package_path="$(find "release/${{ matrix.arch }}" -type f -name '${{ matrix.pattern }}' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No ${{ matrix.pattern }} package was produced."
            exit 1
          fi
          cp "$package_path" "release-assets/${{ matrix.asset }}"

      - name: Verify Gatekeeper acceptance
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED == 'true'
        run: >
          bash scripts/verify-macos-release.sh
          "release-assets/${{ matrix.asset }}"
          "$APPLE_TEAM_ID"

      - name: Verify ad-hoc macOS signature
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_ENABLED != 'true'
        run: >
          bash scripts/verify-macos-adhoc-release.sh
          "release-assets/${{ matrix.asset }}"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: 4. Publish Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Verify release assets
        run: |
          test -f release-assets/browso-linux-x86-64.AppImage
          test -f release-assets/browso-mac-apple-silicon.dmg
          test -f release-assets/browso-mac-mac-intel.dmg
          test -f release-assets/browso-win-x64.exe
          test -f release-assets/mac-arm64-mac.yml
          test -f release-assets/mac-x64-mac.yml
          test -f release-assets/win-x64.yml
          test -f release-assets/linux-x64-linux.yml
          find release-assets -maxdepth 1 -type f \
            ! -name '*.yml' ! -name '*.blockmap' ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Browso ${RELEASE_TAG}.

          ## Downloads

          - \`browso-linux-x86-64.AppImage\`
          - \`browso-mac-apple-silicon.dmg\`
          - \`browso-mac-mac-intel.dmg\`
          - \`browso-win-x64.exe\`
          - **Checksums:** \`SHA256SUMS.txt\`

          Installed applications use the architecture-specific update metadata
          in this release to download and install updates in place.
          EOF

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            prerelease_args=()
            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
